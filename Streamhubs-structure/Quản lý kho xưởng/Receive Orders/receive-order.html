<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StreamHub</title>
    </head>
<body class="sidebar-mini layout-navbar-fixed layout-fixed app-loaded sidebar-collapse">
    <div class="wrapper">
        
        <nav class="header-stream main-header navbar navbar-expand navbar-white navbar-light">
            <div class="container-fluid">
                <img src="/files/image/logo.png" width="200">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link pt-0" data-lte-toggle="sidebar" href="#"><i class="bi bi-list fs-3"></i></a></li>
                    <li class="nav-item d-none d-md-block"><a href="/by-qrcode" class="nav-link">QC Order</a></li>
                    <li class="nav-item d-none d-md-block"><a href="/scan-track" class="nav-link">Scan Track</a></li>
                    <li class="nav-item"><a id="startScan"><i class="bi bi-qr-code fs-3"></i></a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown user-menu">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">
                            <span class="d-none d-md-inline">Nguyễn Văn A</span>
                        </a>
                        </li>
                </ul>
            </div>
        </nav>

        <aside class="main-sidebar sidebar-light-primary elevation-4">
            <div class="sidebar sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                        <li class="nav-item"><a href="#" class="nav-link"><p>Dashboard</p></a></li>
                        <li class="nav-item"><a href="/orders" class="nav-link"><p>Orders</p></a></li>
                        <li class="nav-item"><a href="/products" class="nav-link"><p>Products</p></a></li>
                        <li class="nav-item"><a href="#" class="nav-link"><p>Quản lý kho xưởng</p></a></li>
                        <li class="nav-item"><a href="/request-payment" class="nav-link"><p>Đề nghị thanh toán</p></a></li>
                        <li class="nav-item"><a href="/auto-label" class="nav-link"><p>Auto Label</p></a></li>
                        <li class="nav-item"><a href="/documents" class="nav-link"><p>Documents</p></a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <div class="content-wrapper">
            <section class="container-fluid">
                <div class="box-body no-padding">
                    <div class="row m-5 pt-5">
                        <div class="col-10 offset-1">
                            
                            <a class="btn btn-primary" href="javascript:void(0)" onclick="jsCommon.addShipDaily()">
                                <i class="bi bi-plus"></i> Add thông tin đơn hàng đã nhận
                            </a>
                            
                            <div class="card p-3 mt-2">
                                <h4>Quét mã đơn</h4>
                                <hr>
                                <form id="form-qcorder" action="/receive-order" method="post">
                                    <input type="hidden" name="_csrf" value="[Token_Bảo_Mật]">
                                    <div class="row">
                                        <div class="col-12">
                                            <input class="form-control" name="order_id" placeholder="Order ID" value="" style="height: 60px;">
                                            <button type="submit" style="position: absolute;top: 1px;right: 9px;border: none;padding: 6.5px 30px;border-radius: 0px;font-size: 30px;">
                                                <i class="bi bi-search"></i>
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            
                            <div id="id-pjax" data-pjax-container=""></div>
                            
                        </div>
                    </div>
                </div>
            </section>
        </div>
        
        <div id="modal-scan" class="modal">
            <div class="modal-content" style="width: 100%;">
                <button class="close-btn" id="close-modal">×</button>
                <div id="reader"></div>
                <video id="product-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <canvas id="capture-canvas" style="display: none;"></canvas>
                <button id="capture-btn" class="btn btn-success mt-2 rounded-pill" style="display: none;">Chụp ảnh sản phẩm</button>
                <div class="mt-2" id="image_uploaded" style="display: flex; flex-wrap: wrap; gap: 5px;"></div>
            </div>
        </div>

        <div class="list-notification"></div>

        </div>
</body>
</html>
