<body class="sidebar-mini layout-navbar-fixed layout-fixed">
    <div class="wrapper">
        
        <nav class="main-header navbar">
            </nav>

        <aside class="main-sidebar">
            <div class="sidebar sidebar-wrapper">
                <ul class="nav sidebar-menu" data-lte-toggle="treeview">
                    <li class="nav-item menu-open">
                        <a href="#"><p>Quản lý kho xưởng</p></a>
                        <ul class="nav nav-treeview">
                            <li class="nav-item"><a href="/gen-qrcode" class="active"><p>Tạo QRcode</p></a></li>
                            </ul>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="content-wrapper">
            <section class="container-fluid inventory-qrcode">
                <div class="row">
                    <div class="col">
                        <div class="card mt-3 p-3">
                            
                            <h4>Tạo QRcode</h4>
                            <div class="text-right">
                                <a class="btn btn-info btn-sm" href="/print-qrcode">In mã QR có sẵn</a>
                            </div>
                            <hr>
                            
                            <ul class="nav nav-tabs" role="tablist">
                                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#styles">Phôi áo</a></li>
                                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#embthreads">Chỉ thêu</a></li>
                            </ul>
                            
                            <div class="tab-content">
                                
                                <div id="styles" class="p-3 tab-pane active">
                                    <form id="w0" class="form-gen-qrcode" action="/gen-qrcode" method="post">
                                        <input type="hidden" name="type" value="product_type"/>
                                        
                                        <div class="row">
                                            <div class="col">
                                                <select name="supplier_id"><option>Chọn nhà cung cấp</option></select>
                                                <input name="lot_number" placeholder="Lô sản xuất">
                                                <select name="style"><option>Chọn Style</option></select>
                                                <input name="quantity" placeholder="Số lượng (chiếc)">
                                                <select name="currency"><option>VND/USD...</option></select>
                                                <input name="price" placeholder="Giá 1 đơn vị">
                                                <a class="btn btn-warning">Add Line</a>
                                            </div>
                                        </div>
                                        
                                        <div class="row mt-2">
                                            <div class="col">
                                                <button type="submit" class="btn btn-success">Tạo QRcode</button>
                                                <button class="btn btn-primary">In QRcode</button>
                                                <label><input type="file" accept="*"> Import Excel</label>
                                                <a href="/files/template_p.xlsx">Template Excel</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                
                                <div id="embthreads" class="p-3 tab-pane">
                                    <form id="w1" class="form-gen-qrcode" action="/gen-qrcode" method="post">
                                        <input type="hidden" name="type" value="threads"/>
                                        
                                        <div class="row">
                                            <div class="col">
                                                <input name="lot_number" placeholder="Lô sản xuất">
                                                <select name="emb_supplier"><option>Chọn nhà cung cấp</option></select>
                                                <select name="emb_thread"><option>Chọn chỉ</option></select>
                                                <input name="quantity" placeholder="Số lượng (cuộn)">
                                                <select name="currency"><option>VND/USD...</option></select>
                                                <input name="price" placeholder="Giá 1 đơn vị">
                                                <a class="btn btn-warning">Add Line</a>
                                            </div>
                                        </div>
                                        
                                        <div class="row mt-2">
                                            <div class="col">
                                                <button type="submit" class="btn btn-success">Tạo QRcode</button>
                                                <button class="btn btn-primary">In QRcode</button>
                                                <label><input type="file" accept="*"> Import Excel</label>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                
                            </div>
                            
                            <hr>
                            
                            <style>
                                /* CSS setup layout in ấn nhãn QR (Kích thước giấy 105mm x 152mm) */
                                #qrcodes { width: 105mm; height: 152mm; display: flex; flex-direction: column; ... }
                                .row-qr { display: flex; justify-content: space-between; ... }
                                .cell { width: 35mm; height: 22mm; border: 1px solid lightgrey; ... }
                                .text-container { writing-mode: vertical-rl; ... } /* Hiển thị chữ dọc */
                            </style>
                            
                            <div id="qrcodes">
                                </div>

                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div id="modal-scan" class="modal">...</div>
        <div class="list-notification"></div>
        
        </div>
</body>
