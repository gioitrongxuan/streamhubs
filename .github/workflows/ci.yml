# CI cho StreamHub backend: typecheck + unit test + validate SQL migration
# trên MySQL 8 thật + build thử Docker image.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Typecheck, test & migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: streamhub
          MYSQL_USER: streamhub
          MYSQL_PASSWORD: streamhub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate migrations + seeds
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: streamhub
          DB_PASSWORD: streamhub
          DB_NAME: streamhub
        run: |
          npm run db:migrate
          npm run db:seed

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t streamhub-backend:ci ./backend
